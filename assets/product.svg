<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5127"/>
      <stop offset=".5" stop-color="#164121"/>
      <stop offset="1" stop-color="#0c2c14"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#2a6531" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0c2c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/>
      <stop offset=".5" stop-color="#E7A11D"/>
      <stop offset="1" stop-color="#C67E12"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7a3a"/>
      <stop offset="1" stop-color="#79a44d"/>
    </linearGradient>
  </defs>

  <rect width="240" height="360" fill="url(#bg)"/>
  <rect width="240" height="360" fill="url(#vig)"/>

  <!-- gold frame -->
  <rect x="9" y="9" width="222" height="342" rx="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="16" y="16" width="208" height="328" rx="8" fill="none" stroke="#E7A11D" stroke-opacity=".5" stroke-width="1"/>

  <!-- decorative cusped arch over crest -->
  <path d="M120 34
           C150 34 168 52 168 84
           C168 66 176 60 182 70
           C176 60 168 44 168 40
           M120 34
           C90 34 72 52 72 84
           C72 66 64 60 58 70
           C64 60 72 44 72 40"
        fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-opacity=".85"/>
  <path d="M72 92 C72 58 96 40 120 40 C144 40 168 58 168 92"
        fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- peacock crest -->
  <g fill="url(#gold)" transform="translate(120 78) scale(1.05)">
    <path d="M0 4 C-3 -16 -9 -24 -21 -28 C-13 -16 -11 -6 -7 8 Z"/>
    <path d="M0 4 C-6 -18 -15 -22 -28 -22 C-16 -12 -12 -4 -5 9 Z"/>
    <path d="M0 4 C-6 -14 -17 -14 -30 -10 C-16 -6 -9 0 -4 10 Z"/>
    <path d="M0 4 C3 -16 9 -24 21 -28 C13 -16 11 -6 7 8 Z"/>
    <path d="M0 4 C6 -18 15 -22 28 -22 C16 -12 12 -4 5 9 Z"/>
    <path d="M0 4 C6 -14 17 -14 30 -10 C16 -6 9 0 4 10 Z"/>
    <path d="M0 4 C0 -18 0 -26 0 -30 C0 -18 0 -6 0 8 Z"/>
    <circle cx="-21" cy="-27" r="2.4" fill="#12401b"/>
    <circle cx="-28" cy="-21" r="2.4" fill="#12401b"/>
    <circle cx="21" cy="-27" r="2.4" fill="#12401b"/>
    <circle cx="28" cy="-21" r="2.4" fill="#12401b"/>
    <circle cx="0" cy="-29" r="2.4" fill="#12401b"/>
    <!-- body -->
    <path d="M0 6 C5 14 5 30 2 46 C1 55 1 64 3 72 C1 74 -1 74 -3 72 C-1 64 -1 55 -2 46 C-5 30 -5 14 0 6 Z"/>
    <circle cx="0" cy="4" r="4.5"/>
  </g>

  <!-- brand text -->
  <text x="120" y="188" text-anchor="middle" font-family="'Baloo 2','Tiro Devanagari Hindi',sans-serif"
        font-size="46" font-weight="800" fill="url(#gold)">मन्नत चाय</text>
  <text x="120" y="214" text-anchor="middle" font-family="'Poppins',sans-serif"
        font-size="15" font-weight="700" letter-spacing="6" fill="#F2C14B">MANNAT CHAI</text>

  <line x1="70" y1="228" x2="170" y2="228" stroke="#E7A11D" stroke-width="1" stroke-opacity=".6"/>
  <text x="120" y="244" text-anchor="middle" font-family="'Poppins',sans-serif"
        font-size="9" font-weight="600" letter-spacing="3" fill="#cfe0b8">PREMIUM ASSAM CTC TEA</text>

  <!-- tea garden band -->
  <path d="M16 280 H224 V344 a8 8 0 0 1 -8 8 H24 a8 8 0 0 1 -8 -8 Z" fill="url(#field)"/>
  <g stroke="#2c5e2b" stroke-width="3" opacity=".5" fill="none">
    <path d="M16 296 Q120 286 224 300"/>
    <path d="M16 314 Q120 302 224 318"/>
    <path d="M16 334 Q120 320 224 338"/>
  </g>
  <line x1="16" y1="280" x2="224" y2="280" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="86" y="264" width="68" height="20" rx="10" fill="#0c2c14" stroke="url(#gold)" stroke-width="1"/>
  <text x="120" y="278" text-anchor="middle" font-family="'Poppins',sans-serif"
        font-size="10" font-weight="700" letter-spacing="1" fill="#F2C14B">NET WT. 250g</text>
</svg>
